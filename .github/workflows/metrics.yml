name: Metrics
on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06:00 de Brasília
  workflow_dispatch:      # permite rodar na mão
jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Estatísticas gerais
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          config_timezone: America/Sao_Paulo
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes

      # O plugin de linguagens do metrics sai vazio com repositórios privados,
      # então o card de linguagens é gerado por um script próprio.
      - name: Baixa o repositório atualizado
        uses: actions/checkout@v4

      - name: Linguagens mais usadas
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/languages.py languages.svg

      - name: Salva o card de linguagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git diff --cached --quiet || (git commit -m "Update languages.svg - [Skip GitHub Action]" && git pull --rebase && git push)
